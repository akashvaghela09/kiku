<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiku</title>
    <script>
      // Resolve the theme before first paint so there is no flash. This is the only
      // theme mechanism, which is why tokens.css needs just one dark block.
      //
      // The saved choice is read from localStorage rather than from preferences,
      // which arrive over IPC one round trip after this needs to be decided. Rust is
      // still the source of truth; this is a cache of it, written by theme.ts, and
      // anything unreadable or unrecognised falls back to the desktop setting.
      (function () {
        var saved;
        try {
          saved = window.localStorage.getItem('kiku-theme');
        } catch (error) {
          saved = null;
        }
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/windows/main/entry.tsx"></script>
  </body>
</html>
