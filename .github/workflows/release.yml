name: Build

# Two jobs from one definition, because the build is identical either way and only the
# destination differs:
#
#   push to master  ->  installers uploaded as workflow artefacts, downloadable for 30
#                       days. Every push gives you something to test, without filling
#                       the releases page with noise.
#   push of a v* tag -> the same installers, attached to a draft GitHub release.
#
# Nothing here publishes on its own: a tagged release is created as a draft, so
# publishing stays a decision a person makes.
on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing must not throw away the artefacts of the others.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
            artifact: linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
            artifact: windows
          # Apple Silicon only. Intel Macs have no acceleration path and are out of
          # scope; see docs/SCOPE.md.
          - platform: macos-14
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            artifact: macos-aarch64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev build-essential curl wget file libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Test
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --lib

      # The release binary must exist before bundling: the sherpa-onnx shared
      # libraries only appear in target/release once the build script has run, and
      # tauri.<platform>.conf.json lists them as bundle resources.
      - name: Build
        working-directory: src-tauri
        run: cargo build --release ${{ matrix.args }}

      # Tagged: attach to a draft release.
      - name: Bundle and draft a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kiku ${{ github.ref_name }}'
          releaseBody: |
            Kiku is not code-signed, so each platform warns once on first launch.
            See the README for how to get past it on your system.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Untagged: just build, so there is something to download from the run.
      - name: Bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: kiku-${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
