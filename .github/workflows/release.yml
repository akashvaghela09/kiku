name: Release

# Publishing is manual and tag-driven. Kiku does not update itself, so a release is
# something a person decides to make, not something that happens on every push.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not throw away the artefacts of the others.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          # Apple Silicon only. Intel Macs have no acceleration path and are out of
          # scope; see docs/SCOPE.md.
          - platform: macos-14
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev build-essential curl wget file libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Test
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --lib

      # The release binary must be built before bundling, because the sherpa-onnx
      # shared libraries only exist in target/release once the build script has run,
      # and tauri.<platform>.conf.json lists them as bundle resources.
      - name: Build
        working-directory: src-tauri
        run: cargo build --release ${{ matrix.args }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kiku ${{ github.ref_name }}'
          releaseBody: |
            Kiku is not code-signed, so each platform warns once on first launch.
            See the README for how to get past it on your system.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
