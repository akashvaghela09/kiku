name: Build

# Two jobs from one definition, because the build is identical either way and only the
# destination differs:
#
#   push to master  ->  installers uploaded as workflow artefacts, downloadable for 30
#                       days. Every push gives you something to test, without filling
#                       the releases page with noise.
#   push of a v* tag -> the same installers, attached to a draft GitHub release.
#
# Nothing here publishes on its own: a tagged release is created as a draft, so
# publishing stays a decision a person makes.
on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing must not throw away the artefacts of the others.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
            artifact: linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
            artifact: windows
          # Apple Silicon only. Intel Macs have no acceleration path and are out of
          # scope; see docs/SCOPE.md.
          - platform: macos-14
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            artifact: macos-aarch64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev build-essential curl wget file libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # sherpa-onnx's shared libraries are pruned from a cached target/ while
          # cargo still believes the build script is fresh, which fails the link with
          # "unable to find library -lonnxruntime". build.rs stages them here and
          # restores them when target/ has lost them, so this directory has to survive
          # the cache as well.
          cache-directories: 'src-tauri/resources/lib'

      # The ubuntu runner ships with about 14GB free, and this job fills it: a debug
      # target tree for the tests, a release one for the bundle, and several copies of
      # onnxruntime besides. It ran out during AppImage creation, which surfaced as the
      # useless message "failed to run linuxdeploy" after a disk-space warning. None of
      # these toolchains are used here.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h / | tail -1

      - run: npm ci

      # Windows has no rpath: a binary resolves its DLLs from its own directory, and a
      # test binary lives in target/<profile>/deps. build.rs copies them there, but a
      # build script only does that when it actually runs - on a cache hit cargo can
      # consider it fresh while the cache has pruned the DLLs from target/, leaving the
      # test binary to load whatever onnxruntime.dll the runner already has. That is
      # why this failed as STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139), a wrong library
      # rather than a missing one, and why copying from build.rs alone was not enough.
      #
      # resources/lib is cached in its own right, so it is the one copy that survives
      # whether or not the build script runs. The listing is here because the runner
      # cannot be inspected any other way.
      - name: Stage native libraries beside the test binaries
        shell: bash
        run: |
          mkdir -p src-tauri/target/debug/deps
          if compgen -G 'src-tauri/resources/lib/*' > /dev/null; then
            cp -f src-tauri/resources/lib/* src-tauri/target/debug/deps/ || true
          fi
          echo '--- src-tauri/resources/lib ---'
          ls -la src-tauri/resources/lib 2>/dev/null || echo '(absent)'
          echo '--- native libraries in target/debug/deps ---'
          ls -la src-tauri/target/debug/deps 2>/dev/null \
            | grep -Ei '\.(dll|so|dylib)' || echo '(none)'

      # bindings.ts is generated from the Rust command signatures and committed, so a
      # fresh clone can typecheck without a Rust build. Regenerate it here and fail if
      # it differs: that is what stops a stale copy from quietly compiling.
      - name: Verify generated IPC bindings are current
        working-directory: src-tauri
        run: |
          cargo test export_bindings
          git diff --exit-code ../src/lib/ipc/bindings.ts
      - name: Check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Test
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --lib

      # The release binary must exist before bundling: the sherpa-onnx shared
      # libraries only appear in target/release once the build script has run, and
      # tauri.<platform>.conf.json lists them as bundle resources.
      - name: Build
        working-directory: src-tauri
        run: cargo build --release ${{ matrix.args }}

      # Tagged: attach to a draft release.
      - name: Bundle and draft a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kiku ${{ github.ref_name }}'
          releaseBody: |
            Kiku is not code-signed, so each platform warns once on first launch.
            See the README for how to get past it on your system.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Untagged: just build, so there is something to download from the run.
      - name: Bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: kiku-${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error
          # Two shapes, because a build with an explicit --target writes to
          # target/<triple>/release/bundle instead of target/release/bundle. macOS
          # passes a target and so landed in the second form, which the first glob
          # missed entirely - the build and the bundling had both succeeded.
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/*/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.deb
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.msi
            src-tauri/target/*/release/bundle/**/*-setup.exe
