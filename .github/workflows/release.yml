name: Build

# Two jobs from one definition, because the build is identical either way and only the
# destination differs:
#
#   push to master  ->  installers uploaded as workflow artefacts, downloadable for 30
#                       days. Every push gives you something to test, without filling
#                       the releases page with noise.
#   push of a v* tag -> the same installers, attached to a draft GitHub release.
#
# Nothing here publishes on its own: a tagged release is created as a draft, so
# publishing stays a decision a person makes.
on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

# Every step below runs several commands. GitHub's default shell on Windows is pwsh,
# which propagates only the LAST command's exit code, so `cargo test` could crash and
# the step would still pass if the `git diff` after it returned 0. That is exactly what
# happened: the Windows bindings check reported green for weeks while the test binary
# was dying with STATUS_ENTRYPOINT_NOT_FOUND.
defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing must not throw away the artefacts of the others.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
            artifact: linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
            artifact: windows
          # Apple Silicon only. Intel Macs have no acceleration path and are out of
          # scope; see docs/SCOPE.md.
          - platform: macos-14
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            artifact: macos-aarch64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev build-essential curl wget file libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Registry and toolchain only; target/ is deliberately NOT cached here.
      #
      # sherpa-rs-sys downloads and extracts sherpa-onnx into a directory outside
      # target/ and emits a link search path pointing at it. A restored target/ makes
      # cargo consider that build script fresh, so it never re-extracts, and the link
      # then fails on whatever it cannot find: "unable to find library -lonnxruntime"
      # on Linux, "cannot open input file 'cargs.lib'" on Windows. The staging in
      # build.rs papers over the shared libraries but cannot cover import libraries,
      # and the whole arrangement is a workaround for a cache this workflow does not
      # need. A release should be built from clean anyway.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-targets: false

      # The ubuntu runner ships with about 14GB free, and this job fills it: a debug
      # target tree for the tests, a release one for the bundle, and several copies of
      # onnxruntime besides. It ran out during AppImage creation, which surfaced as the
      # useless message "failed to run linuxdeploy" after a disk-space warning. None of
      # these toolchains are used here.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h / | tail -1
          # Not /usr/local/lib/node_modules, which is where npm itself lives, and not
          # the hosted tool cache, which holds the Node that setup-node just put there.
          # Removing either leaves `npm ci` failing with exit code 127.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost
          sudo apt-get clean
          df -h / | tail -1

      - run: npm ci

      # Windows has no rpath: a binary resolves its DLLs from its own directory, and a
      # test binary lives in target/<profile>/deps. build.rs copies them there, but a
      # build script only does that when it actually runs - on a cache hit cargo can
      # consider it fresh while the cache has pruned the DLLs from target/, leaving the
      # test binary to load whatever onnxruntime.dll the runner already has. That is
      # why this failed as STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139), a wrong library
      # rather than a missing one, and why copying from build.rs alone was not enough.
      #
      # resources/lib is cached in its own right, so it is the one copy that survives
      # whether or not the build script runs. The listing is here because the runner
      # cannot be inspected any other way.
      - name: Stage native libraries beside the test binaries
        shell: bash
        run: |
          mkdir -p src-tauri/target/debug/deps
          if compgen -G 'src-tauri/resources/lib/*' > /dev/null; then
            cp -f src-tauri/resources/lib/* src-tauri/target/debug/deps/ || true
          fi
          echo '--- src-tauri/resources/lib ---'
          ls -la src-tauri/resources/lib 2>/dev/null || echo '(absent)'
          echo '--- native libraries in target/debug/deps ---'
          ls -la src-tauri/target/debug/deps 2>/dev/null \
            | grep -Ei '\.(dll|so|dylib)' || echo '(none)'

      # bindings.ts is generated from the Rust command signatures and committed, so a
      # fresh clone can typecheck without a Rust build. Regenerate it here and fail if
      # it differs: that is what stops a stale copy from quietly compiling.
      # Linux only. The bindings are generated from Rust signatures that do not vary
      # by platform, so running this three times checks the same thing three times.
      - name: Verify generated IPC bindings are current
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          cargo test export_bindings
          git diff --exit-code ../src/lib/ipc/bindings.ts
      - name: Check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Test
        working-directory: src-tauri
        run: |
          # Clippy everywhere: it is check-only, so it never links or executes a
          # binary, which makes it immune to the loader problem below while still
          # catching the cfg and dead-code mistakes that only appear off Linux.
          cargo clippy --all-targets -- -D warnings

          # The test binary is not run on Windows. sherpa-rs-sys's build script emits
          # `cargo:rustc-link-lib=msvcrtd`, the debug C runtime, whenever it is itself
          # compiled with debug assertions, which is every dev and test build. Rust's
          # std links the release CRT, the linker warns `LNK4098: defaultlib 'msvcrt'
          # conflicts`, msvcrtd wins, and the executable then imports a debug UCRT that
          # does not match the runner's SDK. It dies at load with
          # STATUS_ENTRYPOINT_NOT_FOUND before the harness prints a line.
          #
          # Release builds never receive that directive, so this is a property of the
          # test profile and not of anything shipped. Disabling debug assertions for
          # build scripts does fix it, but `build-override` also covers proc macros,
          # and `tauri_utils::acl::resolved::ResolvedCommand` has a `#[cfg(debug_
          # assertions)]` field, so `generate_context!` then emits a struct literal
          # missing it and nothing compiles at all.
          if [ "$RUNNER_OS" != "Windows" ]; then
            cargo test --lib
          fi

      # STATUS_ENTRYPOINT_NOT_FOUND names a real DLL missing a real export, and the
      # libraries are demonstrably already beside the binary, so placement is not the
      # cause. This prints both sides of the import table once so the next change is
      # informed rather than another guess. Remove it once the cause is known.
      - name: Diagnose the Windows loader failure
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        working-directory: src-tauri
        run: |
          cargo test --no-run 2>&1 | Select-Object -Last 5
          Copy-Item target\debug\*.dll target\debug\deps\ -Force -ErrorAction SilentlyContinue
          "== DLLs beside the test binary"
          Get-ChildItem target\debug\deps\*.dll | Select-Object Name, Length
          if (Test-Path C:\Windows\System32\onnxruntime.dll) {
            "== System32 ALSO has onnxruntime.dll"
            (Get-Item C:\Windows\System32\onnxruntime.dll).VersionInfo | Format-List FileVersion, ProductVersion
          } else { "== System32 has no onnxruntime.dll" }
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $exe = Get-ChildItem target\debug\deps\kiku_lib-*.exe | Select-Object -First 1
          if ($dumpbin -and $exe) {
            "== what the test binary depends on"
            & $dumpbin /DEPENDENTS $exe.FullName
            "== what sherpa-onnx-c-api.dll depends on"
            & $dumpbin /DEPENDENTS target\debug\deps\sherpa-onnx-c-api.dll
            "== symbols it imports from onnxruntime"
            & $dumpbin /IMPORTS target\debug\deps\sherpa-onnx-c-api.dll | Select-String -Pattern 'onnxruntime' -Context 0,25
          } else { "dumpbin or test exe not found" }

      # Tagged: attach to a draft release.
      - name: Bundle and draft a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kiku ${{ github.ref_name }}'
          releaseBody: |
            Kiku is not code-signed, so each platform warns once on first launch.
            See the README for how to get past it on your system.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Untagged: just build, so there is something to download from the run.
      - name: Bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: kiku-${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error
          # Two shapes, because a build with an explicit --target writes to
          # target/<triple>/release/bundle instead of target/release/bundle. macOS
          # passes a target and so landed in the second form, which the first glob
          # missed entirely - the build and the bundling had both succeeded.
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/*/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.deb
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.msi
            src-tauri/target/*/release/bundle/**/*-setup.exe
