name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev build-essential libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # bindings.ts is generated from the Rust command signatures and committed, so a
      # fresh clone can typecheck without a Rust build. Regenerate it here and fail if
      # it differs: that is what stops a stale copy from quietly compiling.
      - name: Verify generated IPC bindings are current
        working-directory: src-tauri
        run: |
          cargo test export_bindings
          git diff --exit-code ../src/lib/ipc/bindings.ts
      - name: Frontend
        run: |
          npm run lint
          npx tsc --noEmit
          npx vite build

      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
