name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Every step below runs several commands. GitHub's default shell on Windows is pwsh,
# which propagates only the LAST command's exit code, so `cargo test` could crash and
# the step would still pass if the `git diff` after it returned 0. That is exactly what
# happened: the Windows bindings check reported green for weeks while the test binary
# was dying with STATUS_ENTRYPOINT_NOT_FOUND.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev build-essential libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # sherpa-onnx's shared libraries are pruned from a cached target/ while
          # cargo still believes the build script is fresh, which fails the link with
          # "unable to find library -lonnxruntime". build.rs stages them here and
          # restores them when target/ has lost them, so this directory has to survive
          # the cache as well.
          cache-directories: 'src-tauri/resources/lib'

      - run: npm ci

      # bindings.ts is generated from the Rust command signatures and committed, so a
      # fresh clone can typecheck without a Rust build. Regenerate it here and fail if
      # it differs: that is what stops a stale copy from quietly compiling.
      - name: Verify generated IPC bindings are current
        working-directory: src-tauri
        run: |
          cargo test export_bindings
          git diff --exit-code ../src/lib/ipc/bindings.ts
      - name: Frontend
        run: |
          npm run lint
          npx tsc --noEmit
          npx vite build

      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib

  # Compiling on the other two platforms, without linking, running or bundling
  # anything.
  #
  # This exists because of a specific failure: a module whose only callers were
  # `#[cfg(target_os = "linux")]` was itself compiled everywhere, so it was dead code
  # on macOS and Windows and `-D warnings` rejected it. Nothing on a Linux machine can
  # see that, and it was only found by a release build twenty-five minutes into a tag.
  #
  # `cargo clippy` runs build scripts but never links a binary or executes one, so it
  # catches that whole class in a few minutes and is immune to the loader problems that
  # make running tests on Windows impractical.
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            sherpa-cache: ~\AppData\Local\sherpa-rs
          - os: macos-14
            sherpa-cache: ~/Library/Caches/sherpa-rs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # Registry only. A restored target/ lets cargo treat sherpa-rs-sys's build
          # script as fresh while the archive it extracted is gone, and the link then
          # fails on a library that is no longer where the search path says it is.
          cache-targets: false
          cache-directories: ${{ matrix.sherpa-cache }}

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
