[package]
name = "kiku"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Offline dictation. Hold a key, speak, and the text appears where you're typing."
authors = ["Akash Vaghela"]
license = "MIT"
repository = "https://github.com/akashvaghela09/kiku"
default-run = "kiku"

[lib]
name = "kiku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-opener = "2.5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pinned exactly: tauri-specta's Tauri 2 line is a long-lived release candidate, so
# an unpinned range would pull breaking changes between rc builds.
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
cpal = "0.18"
rubato = "5"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "http2",
    "json",
] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["fs", "io-util"] }
enigo = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
semver = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[features]
# Type generation runs as a test so it cannot end up in a release binary.
default = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
hound = "3.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
